name: Build Walton AC Remote APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        type: string
        required: true
        default: claude/ac-remote-swing-control-3g4iki
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p WaltonACRemote :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: WaltonACRemote-debug-apk
          path: WaltonACRemote/app/build/outputs/apk/debug/app-debug.apk
