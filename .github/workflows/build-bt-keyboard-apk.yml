name: Build Bluetooth Keyboard APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        type: string
        required: true
        default: claude/android-bluetooth-keyboard-app-wgneiy
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: bluetooth-keyboard
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: bt-keyboard-debug-apk
          path: bluetooth-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
